[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlane"
dynamic = ["version"]
description = "Git-native coordination for humans and coding agents working concurrently on one repository"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "thetrueshags"}]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]

[project.scripts]
agentlane = "agentlane.board:main"

[project.urls]
Homepage = "https://github.com/thetrueshags/AgentLane"
Issues = "https://github.com/thetrueshags/AgentLane/issues"

[tool.setuptools.dynamic]
version = {attr = "agentlane.__version__"}

[tool.setuptools.packages.find]
include = ["agentlane*"]

[tool.setuptools.package-data]
agentlane = ["templates/*"]
