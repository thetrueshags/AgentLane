<svg xmlns="http://www.w3.org/2000/svg" width="552" height="1860" viewBox="0 0 552 1860" role="img" aria-labelledby="title description"><title id="title">Before and after AgentLane: humans and coding agents at a hackathon</title><desc id="description">Three human teammates direct Codex on the UI, Claude Code on the API, and Gemini CLI on demo documentation. All agents use separate clones of the same GitHub repository. Without shared coordination, UI and API changes overlap in shared/types.ts. With AgentLane, the API lane owns the shared types, the frontend overlapping claim is refused, and project gates check each direct landing against updated main.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#596779" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="552" height="1860" rx="20" fill="#0d1117" stroke="none"/><text x="20" y="36" fill="#8acfff" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">AGENTLANE / HACKATHON WORKFLOW</text><text x="20" y="76" fill="#f0f6fc" font-size="26" font-weight="650" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">Hackathon team. One repo.</text><text x="20" y="105" fill="#a9b5c5" font-size="18" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">Build an event check-in app before demo time.</text><rect x="20" y="126" width="512" height="60" rx="10" fill="#151e2b" stroke="#30465d"/><text x="276" y="150" fill="#8acfff" font-size="14" font-weight="650" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" text-anchor="middle">ONE SHARED GITHUB REPOSITORY</text><text x="276" y="173" fill="#c8d4e2" font-size="16" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" text-anchor="middle">team/checkin · example project</text><g transform="translate(20 202)"><rect x="0" y="0" width="512" height="736" rx="16" fill="#14171e" stroke="#383841"/><rect x="20" y="20" width="84" height="28" rx="14" fill="#3a3021" stroke="none"/><text x="34" y="40" fill="#f2cc8f" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">BEFORE</text><text x="20" y="86" fill="#f0f6fc" font-size="25" font-weight="650" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">Without shared coordination</text><text x="20" y="115" fill="#a9b5c5" font-size="17" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">Separate clones. Coordination kept in chat.</text><rect x="20" y="140" width="472" height="84" rx="10" fill="#191c24" stroke="#30333f"/><text x="36" y="167" fill="#f0f6fc" font-size="19" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">Frontend lead</text><text x="36" y="194" fill="#96a3b5" font-size="15" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">directs Codex</text><path d="M186 157 V207" stroke="#344154"/><text x="202" y="168" fill="#e1e6ed" font-size="18" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">UI + response types</text><text x="202" y="197" fill="#f2cc8f" font-size="16" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">shared/types.ts</text><circle cx="474" cy="182" r="5" fill="#f2cc8f"/><rect x="20" y="236" width="472" height="84" rx="10" fill="#191c24" stroke="#30333f"/><text x="36" y="263" fill="#f0f6fc" font-size="19" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">API lead</text><text x="36" y="290" fill="#96a3b5" font-size="15" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">directs Claude Code</text><path d="M186 253 V303" stroke="#344154"/><text x="202" y="264" fill="#e1e6ed" font-size="18" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">API + response types</text><text x="202" y="293" fill="#f2cc8f" font-size="16" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">shared/types.ts</text><circle cx="474" cy="278" r="5" fill="#f2cc8f"/><rect x="20" y="332" width="472" height="84" rx="10" fill="#191c24" stroke="#30333f"/><text x="36" y="359" fill="#f0f6fc" font-size="19" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">Demo lead</text><text x="36" y="386" fill="#96a3b5" font-size="15" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">directs Gemini CLI</text><path d="M186 349 V399" stroke="#344154"/><text x="202" y="360" fill="#e1e6ed" font-size="18" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">Demo + docs</text><text x="202" y="389" fill="#a9bbce" font-size="16" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">docs/demo.md</text><rect x="20" y="434" width="472" height="76" rx="10" fill="#30251e" stroke="#64503a"/><text x="36" y="462" fill="#f2cc8f" font-size="18" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">UI and API work changed the same types</text><text x="36" y="489" fill="#d2bca2" font-size="16" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">The overlap surfaces when work is combined.</text><path d="M256 522 V548" fill="none" stroke="#596779" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="560" width="472" height="64" rx="10" fill="#24232a" stroke="#45404a"/><text x="38" y="587" fill="#e4d9d1" font-size="18" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">Compare branches. Resolve overlapping edits.</text><text x="38" y="611" fill="#b8aeb7" font-size="16" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">Teammates work out what can merge next.</text><path d="M256 636 V660" fill="none" stroke="#596779" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="674" width="472" height="42" rx="10" fill="#2c2930" stroke="none"/><text x="256" y="702" fill="#e1d7d1" font-size="19" font-weight="650" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" text-anchor="middle">Coordinate checks and merges by hand</text></g><g transform="translate(20 962)"><rect x="0" y="0" width="512" height="736" rx="16" fill="#101824" stroke="#30465d"/><rect x="20" y="20" width="84" height="28" rx="14" fill="#20394e" stroke="none"/><text x="34" y="40" fill="#8acfff" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">AFTER</text><text x="20" y="86" fill="#f0f6fc" font-size="25" font-weight="650" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">With AgentLane</text><text x="20" y="115" fill="#a9b5c5" font-size="17" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">Shared Git board. One clone per agent.</text><rect x="20" y="140" width="472" height="84" rx="10" fill="#151e2b" stroke="#2b3c50"/><text x="36" y="167" fill="#f0f6fc" font-size="19" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">Frontend lead</text><text x="36" y="194" fill="#96a3b5" font-size="15" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">directs Codex</text><path d="M186 157 V207" stroke="#344154"/><text x="202" y="168" fill="#c8e8ff" font-size="18" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">UI</text><text x="202" y="197" fill="#a9bbce" font-size="16" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">web/**</text><rect x="20" y="236" width="472" height="84" rx="10" fill="#151e2b" stroke="#2b3c50"/><text x="36" y="263" fill="#f0f6fc" font-size="19" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">API lead</text><text x="36" y="290" fill="#96a3b5" font-size="15" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">directs Claude Code</text><path d="M186 253 V303" stroke="#344154"/><text x="202" y="264" fill="#c8e8ff" font-size="18" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">API + shared types</text><text x="202" y="293" fill="#a9bbce" font-size="16" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">api/** · shared/**</text><rect x="20" y="332" width="472" height="84" rx="10" fill="#151e2b" stroke="#2b3c50"/><text x="36" y="359" fill="#f0f6fc" font-size="19" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">Demo lead</text><text x="36" y="386" fill="#96a3b5" font-size="15" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">directs Gemini CLI</text><path d="M186 349 V399" stroke="#344154"/><text x="202" y="360" fill="#c8e8ff" font-size="18" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">Demo + docs</text><text x="202" y="389" fill="#a9bbce" font-size="16" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">docs/**</text><rect x="20" y="434" width="472" height="76" rx="10" fill="#1d2a28" stroke="#355449"/><text x="36" y="462" fill="#a2dfbd" font-size="18" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">Frontend overlap refused before editing</text><text x="36" y="489" fill="#b4d0c1" font-size="16" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">shared/types.ts is owned by the API lane.</text><path d="M256 522 V548" fill="none" stroke="#596779" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="560" width="472" height="64" rx="10" fill="#192b3b" stroke="#345876"/><text x="38" y="587" fill="#c8e8ff" font-size="18" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">Each lane: commit → rebase → project gates</text><text x="38" y="611" fill="#a9bbce" font-size="16" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">A failed check keeps the task unfinished.</text><path d="M256 636 V660" fill="none" stroke="#596779" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="674" width="472" height="42" rx="10" fill="#223e53" stroke="none"/><text x="256" y="702" fill="#c8e8ff" font-size="19" font-weight="650" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" text-anchor="middle">Checked landings, one at a time → main</text></g><text x="276" y="1750" fill="#8acfff" font-size="27" font-weight="650" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" text-anchor="middle">Work in parallel.</text><text x="276" y="1784" fill="#c8e8ff" font-size="23" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" text-anchor="middle">Land against updated main.</text><text x="276" y="1814" fill="#a9b5c5" font-size="16" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" text-anchor="middle">Same repo · Separate clones · Shared board</text><text x="276" y="1838" fill="#96a3b5" font-size="14" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" text-anchor="middle">Illustration of direct landing.</text></svg>
