name: AgentLane contribution checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contributions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.9'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the CLI
        run: python -m pip install -e .
      - name: Check syntax and formatting
        run: python tools/check
      - name: Run the test suite
        run: python -m unittest discover -v
      - name: Build and smoke-test the wheel
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          python -m pip wheel . --no-deps --wheel-dir "$RUNNER_TEMP/agentlane-wheels"
          python tools/check-package "$RUNNER_TEMP"/agentlane-wheels/agentlane-*.whl
