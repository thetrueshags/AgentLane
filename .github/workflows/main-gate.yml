name: AgentLane main gate

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-gate
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.AGENTLANE_AUTOMATION_TOKEN }}
      BOARD_MEMBER: ${{ vars.AGENTLANE_AUTOMATION_MEMBER }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AGENTLANE_AUTOMATION_TOKEN || github.token }}
      - name: run the full gate on main
        id: gate
        continue-on-error: true
        run: python3 bin/board gate --all
      - name: propose recovery through a pull request
        if: steps.gate.outcome == 'failure' && env.GH_TOKEN != '' && env.BOARD_MEMBER != ''
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          refs=$(git ls-remote --heads origin board)
          if [ -n "$refs" ]; then
            git config user.name "$BOARD_MEMBER"
            git config user.email agentlane-automation@users.noreply.github.com
            python3 bin/board revert-failed "$BEFORE_SHA" "$AFTER_SHA" --check-base --reason "gate failed on main: $RUN_URL"
          fi
      - name: fail the run if the gate failed
        if: steps.gate.outcome == 'failure'
        run: exit 1
